name: Monthly CMS Data Refresh

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Download latest Care Compare data
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os

          print("Fetching latest Care Compare download URL...")
          meta_url = "https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items/4pq5-n9py"
          with urllib.request.urlopen(meta_url, timeout=30) as r:
              meta = json.load(r)

          dist = meta.get("distribution", [])
          csv_url = None
          for item in dist:
              url = item.get("downloadURL", "")
              if url.endswith(".csv"):
                  csv_url = url
                  break

          if not csv_url:
              raise Exception("Could not find Care Compare CSV URL")

          print(f"Downloading from: {csv_url}")
          urllib.request.urlretrieve(csv_url, "NH_ProviderInfo_latest.csv")
          size = os.path.getsize("NH_ProviderInfo_latest.csv")
          print(f"Downloaded {size:,} bytes")
          PYEOF

      - name: Download latest Health Citations data
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os

          print("Fetching Health Citations URL...")
          meta_url = "https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items/r5ix-sfxw"
          with urllib.request.urlopen(meta_url, timeout=30) as r:
              meta = json.load(r)

          dist = meta.get("distribution", [])
          csv_url = None
          for item in dist:
              url = item.get("downloadURL", "")
              if url.endswith(".csv"):
                  csv_url = url
                  break

          if not csv_url:
              raise Exception("Could not find Health Citations CSV URL")

          print(f"Downloading from: {csv_url}")
          urllib.request.urlretrieve(csv_url, "NH_HealthCitations_latest.csv")
          size = os.path.getsize("NH_HealthCitations_latest.csv")
          print(f"Downloaded {size:,} bytes")
          PYEOF

      - name: Download and process HCRIS SNF cost report (FY2024)
        run: |
          python3 << 'PYEOF'
          import urllib.request, zipfile, os
          import pandas as pd

          print("Downloading HCRIS SNF FY2024 cost report...")
          urllib.request.urlretrieve("https://downloads.cms.gov/FILES/HCRIS/SNF10FY2024.ZIP", "SNF10FY2024.ZIP")
          with zipfile.ZipFile("SNF10FY2024.ZIP") as z:
              z.extractall("hcris_2024")
          print("Extracted:", os.listdir("hcris_2024"))

          rpt = pd.read_csv('hcris_2024/SNF10_2024_rpt.csv', header=None, dtype=str,
              names=['rpt_rec_num','col2','prvdr_num','col4','col5','col6',
                     'fy_bgn_dt','fy_end_dt','proc_dt','col10','col11','col12',
                     'col13','col14','col15','col16','col17','col18','col19'])
          rpt['fy_end_dt'] = pd.to_datetime(rpt['fy_end_dt'], errors='coerce')
          rpt = rpt.sort_values('fy_end_dt', ascending=False).drop_duplicates('prvdr_num', keep='first')
          print(f"Unique providers with a filed cost report: {len(rpt)}")

          # Worksheet A000000: line 00700 = housekeeping, line 00800 = dietary
          # Column 00100 = direct employee costs, Column 00200 = contract labor costs
          target_keys = {
              ('A000000','00700','00100'): 'hk_direct',
              ('A000000','00700','00200'): 'hk_contract',
              ('A000000','00800','00100'): 'diet_direct',
              ('A000000','00800','00200'): 'diet_contract',
          }
          cost_data = {}
          rows_seen = 0
          for chunk in pd.read_csv('hcris_2024/SNF10_2024_nmrc.csv', header=None,
                  names=['rpt_rec_num','wksht_cd','line_num','clmn_num','itm_val_num'],
                  dtype=str, chunksize=500000):
              mask = (
                  (chunk['wksht_cd'] == 'A000000') &
                  (chunk['line_num'].isin(['00700','00800'])) &
                  (chunk['clmn_num'].isin(['00100','00200']))
              )
              filtered = chunk[mask]
              for _, row in filtered.iterrows():
                  key = (row['wksht_cd'], row['line_num'], row['clmn_num'])
                  if key in target_keys:
                      field = target_keys[key]
                      rpt_id = row['rpt_rec_num']
                      if rpt_id not in cost_data:
                          cost_data[rpt_id] = {}
                      try:
                          cost_data[rpt_id][field] = float(row['itm_val_num'])
                      except:
                          cost_data[rpt_id][field] = 0.0
              rows_seen += len(chunk)
          print(f"Scanned {rows_seen:,} HCRIS numeric rows, found cost data for {len(cost_data)} reports")

          cost_df = pd.DataFrame.from_dict(cost_data, orient='index').reset_index()
          cost_df.columns = ['rpt_rec_num'] + list(cost_df.columns[1:])
          cost_df['rpt_rec_num'] = cost_df['rpt_rec_num'].astype(str)
          rpt['rpt_rec_num'] = rpt['rpt_rec_num'].astype(str)

          hcris = rpt[['rpt_rec_num','prvdr_num']].merge(cost_df, on='rpt_rec_num', how='left')
          hcris['prvdr_num'] = hcris['prvdr_num'].str.strip().str.zfill(6)
          hcris.to_csv('hcris_processed.csv', index=False)
          print(f"Saved hcris_processed.csv: {len(hcris)} facilities")
          PYEOF

      - name: Rebuild Powerlink database
        run: |
          python3 << 'PYEOF'
          import pandas as pd
          import json

          print("Loading Care Compare data...")
          df = pd.read_csv("NH_ProviderInfo_latest.csv", dtype=str, low_memory=False)
          df.columns = df.columns.str.strip()
          print(f"Care Compare columns: {list(df.columns[:10])}")

          print("Loading citations data...")
          cit = pd.read_csv("NH_HealthCitations_latest.csv", dtype=str, low_memory=False)
          cit.columns = cit.columns.str.strip()

          # Find facility name column flexibly
          name_col = next((c for c in df.columns if 'facility' in c.lower() and 'name' in c.lower()), None)
          if not name_col:
              name_col = next((c for c in df.columns if 'provider' in c.lower() and 'name' in c.lower()), None)
          if not name_col:
              name_col = df.columns[0]
          print(f"Using name column: {name_col}")
          df = df.rename(columns={name_col: 'Facility Name'})

          # Find column names flexibly in citations file
          print(f"Citation columns: {list(cit.columns[:10])}")
          tag_col = next((c for c in cit.columns if 'tag' in c.lower()), None)
          # CCN column detection: check for 'ccn' or 'certification number' FIRST,
          # since a loose 'provider' + 'id' check incorrectly matches "Provider Name"
          # (the word "provider" itself contains the substring "id").
          prov_col_cit = next((c for c in cit.columns if 'ccn' in c.lower()), None)
          if not prov_col_cit:
              prov_col_cit = next((c for c in cit.columns if 'certification' in c.lower() and 'number' in c.lower()), None)
          if not prov_col_cit:
              prov_col_cit = next((c for c in cit.columns if 'federal' in c.lower() and 'provider' in c.lower() and 'number' in c.lower()), None)
          if not tag_col: tag_col = cit.columns[1]
          if not prov_col_cit: prov_col_cit = cit.columns[0]
          print(f"Tag col: {tag_col}, Provider col: {prov_col_cit}")

          # Find provider number column in main df (process the FULL national df now,
          # not just the veteran subset — the veteran filter is applied at the very end)
          prov_col_df = next((c for c in df.columns if 'ccn' in c.lower() or ('provider' in c.lower() and 'number' in c.lower())), None)
          if not prov_col_df: prov_col_df = df.columns[0]
          print(f"Main df provider col: {prov_col_df}")

          # Normalize deficiency tag numbers to plain 4-digit strings — some CMS
          # exports store them as "F880", others as plain "0880". Handle both.
          cit['_tag_norm'] = (
              cit[tag_col].astype(str).str.upper().str.replace('F', '', regex=False)
              .str.strip().str.zfill(4)
          )

          # Count EVS citations (F880 = infection control, plus related environmental tags)
          evs_tags_norm = ['0880', '0881', '0882', '0883', '0884', '0885']
          evs_cit = cit[cit['_tag_norm'].isin(evs_tags_norm)].copy()
          evs_counts = evs_cit.groupby(prov_col_cit).size().reset_index(name='EVS_Citation_Count')
          evs_counts = evs_counts.rename(columns={prov_col_cit: prov_col_df})

          # Count dietary citations (F800-F812 = food and nutrition services)
          diet_tags_norm = [f'{n:04d}' for n in range(800, 813)]
          diet_cit = cit[cit['_tag_norm'].isin(diet_tags_norm)].copy()
          diet_counts = diet_cit.groupby(prov_col_cit).size().reset_index(name='Dietary_Citation_Count')
          diet_counts = diet_counts.rename(columns={prov_col_cit: prov_col_df})

          # Make sure both join keys are zero-padded strings so the merge actually matches
          evs_counts[prov_col_df] = evs_counts[prov_col_df].astype(str).str.strip().str.zfill(6)
          diet_counts[prov_col_df] = diet_counts[prov_col_df].astype(str).str.strip().str.zfill(6)
          df[prov_col_df] = df[prov_col_df].astype(str).str.strip().str.zfill(6)

          # Merge onto the full national df
          df = df.merge(evs_counts, on=prov_col_df, how='left')
          df = df.merge(diet_counts, on=prov_col_df, how='left')
          df['EVS_Citation_Count'] = pd.to_numeric(df['EVS_Citation_Count'], errors='coerce').fillna(0).astype(int)
          df['Dietary_Citation_Count'] = pd.to_numeric(df['Dietary_Citation_Count'], errors='coerce').fillna(0).astype(int)

          # Merge HCRIS cost report data (self-performing vs. contracted labor)
          hcris = pd.read_csv('hcris_processed.csv', dtype=str)
          hcris = hcris.rename(columns={'prvdr_num': prov_col_df})
          hcris[prov_col_df] = hcris[prov_col_df].astype(str).str.strip().str.zfill(6)
          df[prov_col_df] = df[prov_col_df].astype(str).str.strip().str.zfill(6)
          hcris_cols = ['hk_direct','hk_contract','diet_direct','diet_contract']
          df = df.merge(hcris[[prov_col_df] + hcris_cols], on=prov_col_df, how='left')
          for c in hcris_cols:
              df[c] = pd.to_numeric(df[c], errors='coerce')
          print(f"Facilities matched to an HCRIS cost report: {df['hk_direct'].notna().sum()}")

          # Star ratings - find columns flexibly. Prefer the exact facility-level
          # column name first — a loose match can otherwise pick a "Chain Average"
          # column instead, since those appear earlier in the CSV's column order.
          overall_col = next((c for c in df.columns if c.strip().lower() == 'overall rating'), None)
          if not overall_col:
              overall_col = next((c for c in df.columns if 'overall' in c.lower() and 'rating' in c.lower() and 'chain' not in c.lower()), None)
          health_col = next((c for c in df.columns if c.strip().lower() == 'health inspection rating'), None)
          if not health_col:
              health_col = next((c for c in df.columns if 'health' in c.lower() and 'inspection' in c.lower() and 'rating' in c.lower() and 'chain' not in c.lower()), None)
          print(f"Rating cols: overall={overall_col}, health={health_col}")
          df['Overall_Rating'] = pd.to_numeric(df[overall_col], errors='coerce') if overall_col else 3
          df['Health_Inspection_Rating'] = pd.to_numeric(df[health_col], errors='coerce') if health_col else 3

          # HOT HOT flags:
          #   EVS     = self-performing (no contracted housekeeping labor) AND
          #             BOTH Health Inspection Rating and Overall Rating are 1-2 stars
          #   Dietary = self-performing (no contracted dietary labor) AND
          #             Overall Rating is 1-2 stars
          evs_self_performing = (df['hk_contract'].fillna(0) == 0) & (df['hk_direct'].fillna(0) > 0)
          diet_self_performing = (df['diet_contract'].fillna(0) == 0) & (df['diet_direct'].fillna(0) > 0)

          df['HOT_HOT_EVS'] = (
              evs_self_performing &
              (df['Health_Inspection_Rating'] <= 2) &
              (df['Overall_Rating'] <= 2)
          ).map({True: 'Yes', False: 'No'})

          df['HOT_HOT_Dietary'] = (
              diet_self_performing &
              (df['Overall_Rating'] <= 2)
          ).map({True: 'Yes', False: 'No'})

          # Incumbent Displacement — already contracting out EVS and/or dietary
          is_incumbent = (df['hk_contract'].fillna(0) > 0) | (df['diet_contract'].fillna(0) > 0)

          # Warm Leads — not HOT HOT, not already contracted, but a low health
          # inspection rating is a quality warning sign worth watching
          is_hot_hot = (df['HOT_HOT_EVS'] == 'Yes') | (df['HOT_HOT_Dietary'] == 'Yes')
          is_warm = (~is_hot_hot) & (~is_incumbent) & (df['Health_Inspection_Rating'] <= 2)

          # Priority sort: 1=Hot lead (HOT HOT), 2=Incumbent Displacement, 3=Warm Lead, 4=Other
          def priority(row_is_hot_hot, row_is_incumbent, row_is_warm):
              if row_is_hot_hot:
                  return 1
              elif row_is_incumbent:
                  return 2
              elif row_is_warm:
                  return 3
              else:
                  return 4
          df['Priority_Sort'] = [
              priority(h, i, w) for h, i, w in zip(is_hot_hot, is_incumbent, is_warm)
          ]

          # ── Persistence: only update a facility's flags if it was actually
          # re-surveyed since last month. If CMS hasn't re-inspected a facility,
          # its HOT_HOT_EVS / HOT_HOT_Dietary / Priority_Sort stay exactly as
          # they were in last month's saved file — the freshly-computed values
          # above are discarded for that row and the prior month's are kept.
          survey_col = next((c for c in df.columns if c.strip().lower() == 'rating cycle 1 standard survey health date'), None)
          if survey_col:
              df['_survey_date'] = df[survey_col]
          else:
              df['_survey_date'] = ''

          changed_count = 0
          held_count = 0

          try:
              prev = pd.read_csv('Powerlink_PowerBI_Data.csv', dtype=str, low_memory=False)
              prev.columns = prev.columns.str.strip()
              prev_survey_col = next((c for c in prev.columns if c.strip().lower() == 'rating cycle 1 standard survey health date'), None)
              if prov_col_df in prev.columns and prev_survey_col and 'HOT_HOT_EVS' in prev.columns:
                  prev[prov_col_df] = prev[prov_col_df].astype(str).str.strip().str.zfill(6)
                  prev_small = prev[[prov_col_df, prev_survey_col, 'HOT_HOT_EVS', 'HOT_HOT_Dietary', 'Priority_Sort']].copy()
                  prev_small = prev_small.rename(columns={
                      prev_survey_col: '_prev_survey_date',
                      'HOT_HOT_EVS': '_prev_HOT_HOT_EVS',
                      'HOT_HOT_Dietary': '_prev_HOT_HOT_Dietary',
                      'Priority_Sort': '_prev_Priority_Sort',
                  })
                  df = df.merge(prev_small, on=prov_col_df, how='left')

                  not_reviewed = (
                      df['_prev_survey_date'].notna() &
                      (df['_survey_date'].astype(str) == df['_prev_survey_date'].astype(str))
                  )
                  changed_count = int((~not_reviewed & df['_prev_survey_date'].notna()).sum())
                  held_count = int(not_reviewed.sum())
                  print(f"Facilities with a new survey since last refresh: {changed_count}")
                  print(f"Facilities held at last month's flags (not re-surveyed): {held_count}")

                  df.loc[not_reviewed, 'HOT_HOT_EVS'] = df.loc[not_reviewed, '_prev_HOT_HOT_EVS']
                  df.loc[not_reviewed, 'HOT_HOT_Dietary'] = df.loc[not_reviewed, '_prev_HOT_HOT_Dietary']
                  df.loc[not_reviewed, 'Priority_Sort'] = pd.to_numeric(
                      df.loc[not_reviewed, '_prev_Priority_Sort'], errors='coerce'
                  ).fillna(df.loc[not_reviewed, 'Priority_Sort']).astype(int)

                  df = df.drop(columns=['_prev_survey_date', '_prev_HOT_HOT_EVS', '_prev_HOT_HOT_Dietary', '_prev_Priority_Sort'])
              else:
                  print("Previous file missing expected columns — treating all facilities as newly reviewed this run.")
          except FileNotFoundError:
              print("No previous Powerlink_PowerBI_Data.csv found — treating all facilities as newly reviewed this run.")

          df = df.drop(columns=['_survey_date'])

          # Region map
          region_map = {
              'ME':'Northeast','NH':'Northeast','VT':'Northeast','MA':'Northeast',
              'RI':'Northeast','CT':'Northeast','NY':'Northeast','NJ':'Northeast','PA':'Northeast',
              'DE':'Northeast','MD':'Northeast','DC':'Northeast',
              'VA':'Southeast','WV':'Southeast','NC':'Southeast','SC':'Southeast',
              'GA':'Southeast','FL':'Southeast','AL':'Southeast','MS':'Southeast',
              'TN':'Southeast','KY':'Southeast','AR':'Southeast','LA':'Southeast',
              'OH':'Midwest','IN':'Midwest','IL':'Midwest','MI':'Midwest','WI':'Midwest',
              'MN':'Midwest','IA':'Midwest','MO':'Midwest','ND':'Midwest','SD':'Midwest',
              'NE':'Midwest','KS':'Midwest',
              'TX':'South Central','OK':'South Central',
              'MT':'Mountain West','ID':'Mountain West','WY':'Mountain West','CO':'Mountain West',
              'NM':'Mountain West','AZ':'Mountain West','UT':'Mountain West','NV':'Mountain West',
              'WA':'Pacific','OR':'Pacific','CA':'Pacific','AK':'Pacific','HI':'Pacific',
              'PR':'Territories','VI':'Territories','GU':'Territories',
          }
          state_col = next((c for c in df.columns if 'state' in c.lower()), 'Provider State')
          df['Region'] = df[state_col].map(region_map).fillna('Other')

          # Save the FULL national list
          df.to_csv('Powerlink_PowerBI_Data.csv', index=False)
          print(f"Full national SNF list saved: {len(df)} facilities")

          # Filter to veteran homes only — separate file, doesn't touch the full list
          vet_mask = df['Facility Name'].str.contains(
              r"veteran|veter|state home|soldiers|sailor|war veteran",
              case=False, na=False
          )
          df_vet = df[vet_mask].copy()
          df_vet.to_csv('Powerlink_PowerBI_VetHomes.csv', index=False)
          print(f"Veterans homes list saved: {len(df_vet)} facilities")

          # Changes report (based on full national numbers)
          hot_evs = int((df['HOT_HOT_EVS'] == 'Yes').sum())
          hot_diet = int((df['HOT_HOT_Dietary'] == 'Yes').sum())
          both = int(((df['HOT_HOT_EVS'] == 'Yes') & (df['HOT_HOT_Dietary'] == 'Yes')).sum())
          report = {
              "total_facilities": len(df),
              "total_veteran_facilities": len(df_vet),
              "hot_hot_evs": hot_evs,
              "hot_hot_dietary": hot_diet,
              "hot_hot_both": both,
              "newly_surveyed_this_run": changed_count,
              "held_at_prior_flags": held_count
          }
          with open('changes_report.json', 'w') as f:
              json.dump(report, f)

          print(f"Done. HOT HOT EVS: {hot_evs}, HOT HOT Dietary: {hot_diet}, Both: {both}")
          PYEOF

      - name: Send email alert
        env:
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python3 << 'PYEOF'
          import smtplib, json, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          with open('changes_report.json') as f:
              report = json.load(f)

          FROM = os.environ['ALERT_EMAIL_FROM'].strip()
          TO = os.environ['ALERT_EMAIL_TO'].strip().replace('\n', '').replace('\r', '')
          PASSWORD = os.environ['ALERT_EMAIL_PASSWORD'].strip()

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"Powerlink HOT HOT Update — {report['hot_hot_evs']} EVS | {report['hot_hot_dietary']} Dietary leads pushed to SharpSpring"
          msg['From'] = FROM
          msg['To'] = TO

          html = f"""
          <html><body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;">
          <h2 style="color:#1a1a2e;">Powerlink Monthly Intelligence Refresh</h2>
          <table style="width:100%;border-collapse:collapse;">
            <tr style="background:#e8f4fd;"><td style="padding:12px;font-weight:bold;">Total Veteran Facilities</td><td style="padding:12px;">{report['total_facilities']}</td></tr>
            <tr><td style="padding:12px;font-weight:bold;">HOT HOT EVS Leads</td><td style="padding:12px;color:#c0392b;font-weight:bold;">{report['hot_hot_evs']}</td></tr>
            <tr style="background:#e8f4fd;"><td style="padding:12px;font-weight:bold;">HOT HOT Dietary Leads</td><td style="padding:12px;color:#c0392b;font-weight:bold;">{report['hot_hot_dietary']}</td></tr>
            <tr><td style="padding:12px;font-weight:bold;">Both EVS + Dietary</td><td style="padding:12px;color:#8e44ad;font-weight:bold;">{report['hot_hot_both']}</td></tr>
          </table>
          <p style="margin-top:20px;">HOT HOT facilities are ready to review in the Hot Lead Tool dashboards — send them to SharpSpring from there.</p>
          <a href="https://powerlink-sales-intel.streamlit.app" style="display:inline-block;background:#1a1a2e;color:white;padding:12px 24px;text-decoration:none;border-radius:6px;margin-top:10px;">View Live Dashboard</a>
          </body></html>
          """

          msg.attach(MIMEText(html, 'html'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(FROM, PASSWORD)
              recipients = [e.strip() for e in TO.split(',') if e.strip()]
              server.sendmail(FROM, recipients, msg.as_string())

          print("Email sent successfully")
          PYEOF

      - name: Refresh Hot Lead Tool dashboards (Hospital + SNF)
        run: |
          python3 << 'PYEOF'
          import json, csv, time, urllib.request
          from datetime import datetime, timedelta

          CUTOFF = datetime.utcnow() - timedelta(days=18*30)
          API = "https://ipw27058c6.execute-api.us-west-1.amazonaws.com/prd"
          UA = "Mozilla/5.0 (Powerlink Hot Lead Tool refresh)"

          def fetch_json(url, retries=3):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      if attempt == retries - 1:
                          print(f"  FAILED {url}: {e}")
                          return None
                      time.sleep(1)

          # ---------- HOSPITAL ----------
          print("=== Hospital Hot Lead Tool ===")
          meta_url = "https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items/xubh-q36u"
          with urllib.request.urlopen(meta_url, timeout=30) as r:
              meta = json.load(r)
          hgi_url = next(d["downloadURL"] for d in meta["distribution"] if d["downloadURL"].endswith(".csv"))
          urllib.request.urlretrieve(hgi_url, "Hospital_General_Information.csv")

          cms_info = {}
          with open("Hospital_General_Information.csv", encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f):
                  fid = row["Facility ID"].strip().zfill(6)
                  cms_info[fid] = {
                      "hospital_type": row.get("Hospital Type", "").strip(),
                      "ownership": row.get("Hospital Ownership", "").strip(),
                      "phone": row.get("Telephone Number", "").strip(),
                      "star_rating": row.get("Hospital overall rating", "").strip(),
                      "address": row.get("Address", "").strip(),
                  }

          DIETARY_TAGS = {f"A06{n:02d}" for n in range(18, 38)}
          EVS_TAGS = {"A0700", "A0701"} | {f"A07{n:02d}" for n in range(47, 58)}
          CONDITION_TAGS = {"A0618", "A0700", "A0747"}
          STATES = ["al","ak","az","ar","ca","co","ct","de","dc","fl","ga","hi","id","il","in","ia",
                    "ks","ky","la","me","md","ma","mi","mn","ms","mo","mt","ne","nv","nh","nj","nm",
                    "ny","nc","nd","oh","ok","or","pa","ri","sc","sd","tn","tx","ut","vt","va","wa",
                    "wv","wi","wy"]

          hospital_leads = []
          for state in STATES:
              hlist = fetch_json(f"{API}/hospital-list/{state}")
              if not hlist:
                  continue
              for h in hlist:
                  mrd = h.get("most_recent_inspection_date")
                  if not mrd:
                      continue
                  try:
                      d = datetime.strptime(mrd, "%Y-%m-%d")
                  except ValueError:
                      continue
                  if d < CUTOFF:
                      continue
                  detail = fetch_json(f"{API}/hospital-detail/{h['id']}")
                  if not detail:
                      continue
                  for rep in detail.get("reports", []):
                      idate = rep.get("inspection_date")
                      if not idate or not rep.get("has_details"):
                          continue
                      try:
                          d2 = datetime.strptime(idate, "%Y-%m-%d")
                      except ValueError:
                          continue
                      if d2 < CUTOFF:
                          continue
                      report_id = rep["detail_url"].rsplit("/", 1)[-1]
                      rdetail = fetch_json(f"{API}/report-detail/{report_id}")
                      if not rdetail:
                          continue
                      for cit in rdetail.get("deficiencies_text", []):
                          tag = cit.get("tag", "")
                          if tag in DIETARY_TAGS:
                              category = "Dietary"
                          elif tag in EVS_TAGS:
                              category = "EVS"
                          else:
                              continue
                          severity = "Condition" if tag in CONDITION_TAGS else "Complaint"
                          extra = cms_info.get(h["id"], {})
                          hospital_leads.append({
                              "ccn": h["id"], "category": category,
                              "facility_name": detail.get("name", ""),
                              "hospital_type": extra.get("hospital_type", ""),
                              "address": detail.get("address", "") or extra.get("address", ""),
                              "city": detail.get("city", ""), "state": detail.get("state", ""),
                              "zip": detail.get("zip", ""), "phone": extra.get("phone", ""),
                              "ownership": detail.get("ownership", "") or extra.get("ownership", ""),
                              "star_rating": extra.get("star_rating", ""),
                              "tag": tag, "tag_desc": cit.get("summary", ""), "severity": severity,
                              "survey_date": idate,
                              "lead_reason": f"{severity}-level {category} citation ({tag}: {cit.get('summary','')}) \u2014 surveyed {idate}",
                              "id": f"{h['id']}_{category}_{tag}_{idate}",
                          })
              time.sleep(0.2)
          print(f"Hospital leads found: {len(hospital_leads)}")

          # ---------- SNF ----------
          print("=== SNF Hot Lead Tool ===")
          CONDITION_SEVERITY = {"G", "H", "I", "J", "K", "L"}
          providers = {}
          with open("NH_ProviderInfo_latest.csv", encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f):
                  ccn = row["CMS Certification Number (CCN)"].strip()
                  providers[ccn] = {
                      "facility_name": row.get("Provider Name", "").strip(),
                      "address": row.get("Provider Address", "").strip(),
                      "city": row.get("City/Town", "").strip(),
                      "state": row.get("State", "").strip(),
                      "zip": row.get("ZIP Code", "").strip(),
                      "phone": row.get("Telephone Number", "").strip(),
                      "ownership": row.get("Ownership Type", "").strip(),
                      "chain_name": row.get("Chain Name", "").strip(),
                      "star_rating": row.get("Overall Rating", "").strip(),
                  }

          def snf_category(dcat):
              if dcat == "Nutrition and Dietary Deficiencies":
                  return "Dietary"
              if dcat in ("Environmental Deficiencies", "Infection Control Deficiencies"):
                  return "EVS"
              return None

          snf_leads = []
          with open("NH_HealthCitations_latest.csv", encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f):
                  category = snf_category(row.get("Deficiency Category", "").strip())
                  if not category:
                      continue
                  sdate = row.get("Survey Date", "").strip()
                  try:
                      d = datetime.strptime(sdate, "%Y-%m-%d")
                  except ValueError:
                      continue
                  if d < CUTOFF:
                      continue
                  sev_code = row.get("Scope Severity Code", "").strip()
                  if sev_code not in CONDITION_SEVERITY:
                      continue  # SNF tool ships Condition-level only (see 2026-09 build notes)
                  ccn = row["CMS Certification Number (CCN)"].strip()
                  p = providers.get(ccn, {})
                  tag = f"F{row.get('Deficiency Tag Number','').strip()}"
                  tag_desc = row.get("Deficiency Description", "").strip()
                  snf_leads.append({
                      "ccn": ccn, "category": category,
                      "facility_name": p.get("facility_name") or row.get("Provider Name", ""),
                      "hospital_type": p.get("chain_name") or "Independent",
                      "address": p.get("address", ""), "city": p.get("city", ""),
                      "state": p.get("state", ""), "zip": p.get("zip", ""),
                      "phone": p.get("phone", ""), "ownership": p.get("ownership", ""),
                      "star_rating": p.get("star_rating", ""),
                      "tag": tag, "tag_desc": tag_desc, "severity": "Condition",
                      "survey_date": sdate,
                      "lead_reason": f"Condition-level {category} citation ({tag}: {tag_desc}) \u2014 surveyed {sdate}",
                      "id": f"{ccn}_{category}_{tag}_{sdate}",
                  })
          print(f"SNF leads found: {len(snf_leads)}")

          # ---------- RENDER ----------
          TODAY = datetime.utcnow().strftime("%Y-%m-%d")
          template = open("lead_tool_template.html").read()

          def render(leads, title, subtitle, source, out_path):
              rows = []
              for r in leads:
                  rows.append({**r, "first_seen": TODAY, "last_seen": TODAY, "lead_status": "New"})
              html = template.replace("__TITLE__", title).replace("__SUBTITLE__", subtitle)
              html = html.replace("__SOURCE__", source)
              html = html.replace("__RAW_DATA__", json.dumps(rows, separators=(",", ": ")))
              with open(out_path, "w") as f:
                  f.write(html)
              print(f"Wrote {out_path}: {len(rows)} rows")

          render(hospital_leads, "Powerlink Hospital Hot Lead Tool",
                 "Sourced from hospitalinspections.org (AHCJ) CMS-2567 data (Condition-level or Complaint-triggered Dietary/EVS citations, last 18 months)",
                 "Hospital", "powerlink_hospital_lead_tool_final.html")

          render(snf_leads, "Powerlink SNF Hot Lead Tool",
                 "Sourced from CMS Nursing Home Health Citations data (Condition-level Dietary/EVS citations \u2014 actual harm or higher \u2014 last 18 months)",
                 "SNF", "powerlink_snf_lead_tool_final.html")
          PYEOF

      - name: Commit updated data back to GitHub
        run: |
          git config user.name  "Powerlink Bot"
          git config user.email "bot@powerlink"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git add Powerlink_PowerBI_Data.csv Powerlink_PowerBI_VetHomes.csv changes_report.json powerlink_hospital_lead_tool_final.html powerlink_snf_lead_tool_final.html
          git diff --staged --quiet || git commit -m "Monthly CMS refresh — $(date +'%B %Y')"
          git push
